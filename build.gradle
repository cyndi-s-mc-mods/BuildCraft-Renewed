// Declare every loader plugin here so they share one classloader across subprojects.
plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'net.minecraftforge.gradle' version "${forgegradle_version}" apply false
    id 'net.neoforged.moddev' version "${moddev_version}" apply false
}

subprojects {
    apply plugin: 'java'

    version = rootProject.mod_version
    group = rootProject.maven_group

    base {
        archivesName = "${rootProject.archives_base_name}-${project.name}"
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
        withSourcesJar()
    }

    // Every loader compiles the shared BuildCraft code from common/.
    sourceSets.main {
        java.srcDir rootProject.file('common/src/main/java')
        resources.srcDir rootProject.file('common/src/main/resources')
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 25
    }

    processResources {
        def props = [
                version          : project.version,
                minecraft_version: rootProject.minecraft_version,
                loader_version   : rootProject.fabric_loader_version,
                neoforge_version : rootProject.neoforge_version,
        ]
        inputs.properties props
        filesMatching(['fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
            expand props
        }
    }

    jar {
        from(rootProject.files("LICENSE", "LICENSE-NEW")) {
            rename { "${it}_${rootProject.archives_base_name}" }
        }
    }
}
