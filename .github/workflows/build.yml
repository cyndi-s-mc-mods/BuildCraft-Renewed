name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a release with this tag (e.g. v9.0.0). Leave empty to just build.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: buildcraft
          path: '*/build/libs/*.jar'

  # Starts a dedicated server on each loader with a datapack that builds a few machines, checks they work, and stops
  # the server (see .github/smoke-test).
  server-smoke-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: fabric
            run_dir: fabric/run
          - loader: forge
            run_dir: forge/runs/main/server
          - loader: neoforge
            run_dir: neoforge/run
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Run the smoke test
        env:
          RUN_DIR: ${{ matrix.run_dir }}
        run: |
          mkdir -p "$RUN_DIR"
          echo "eula=true" > "$RUN_DIR/eula.txt"
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\nfunction-permission-level=4\n' > "$RUN_DIR/server.properties"
          rm -rf "$RUN_DIR/world"
          mkdir -p "$RUN_DIR/world/datapacks"
          cp -r .github/smoke-test/buildcraft_smoke "$RUN_DIR/world/datapacks/"
          timeout 900 ./gradlew :${{ matrix.loader }}:runServer < /dev/null 2>&1 | tee server.log || true
          grep "SMOKE" server.log || true
          if ! grep -q "SMOKE done" server.log; then
            tail -n 100 server.log
            echo "The smoke test didn't finish"
            exit 1
          fi
          if grep -q "SMOKE FAIL" server.log; then
            echo "The smoke test failed"
            exit 1
          fi

  # Temporary: publishes each loader's compile classpath to the claude/deps-cache-26.3 branch
  # so the port can be compiled outside of Gradle. Runs only for commits tagged [deps-cache].
  deps-cache:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[deps-cache]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Collect compile classpaths
        run: ./gradlew dumpCompileClasspath

      - name: Push deps branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd build/deps
          # GitHub rejects files over 100 MB, so split any big jar into parts.
          find . -type f -size +95M | while read -r f; do
            split -b 90M -d "$f" "$f.part"
            rm "$f"
          done
          du -sh .
          git init -q -b deps
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Compile classpaths for Minecraft 26.3"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/claude/deps-cache-26.3

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: buildcraft

      - name: Drop sources jars
        run: find . -name '*-sources.jar' -delete

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: BuildCraft ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: '**/*.jar'
